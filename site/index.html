<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17161d">
<title>Image Styler</title>
<meta name="description" content="Stack modifiers — posterize, noise, pixelate, compress, dither, glitch and more — to stylize your photos. Runs entirely in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111'/%3E%3Cpath d='M4 4h8v8H4zM20 4h8v8h-8zM12 12h8v8h-8zM4 20h8v8H4zM20 20h8v8h-8z' fill='%23ff5ea8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true"></span>Image Styler</div>
  <div class="actions">
    <button id="btnOpen" class="btn">Upload</button>
    <button id="btnDownload" class="btn primary" disabled>Download</button>
  </div>
  <input id="file" type="file" accept="image/*" hidden>
</header>

<main class="layout">
  <section class="stage" id="stage">
    <div id="drop" class="drop">
      <div class="drop-inner">
        <div class="drop-title">Drop an image here</div>
        <p>or tap to upload, or paste from clipboard</p>
        <button class="btn" id="btnSample" type="button">Try a sample</button>
      </div>
    </div>
    <div id="canvasWrap" class="canvas-wrap" hidden>
      <canvas id="out"></canvas>
      <canvas id="orig" hidden></canvas>
      <div class="stage-bar">
        <button id="btnCompare" class="btn small" title="Hold to see the original">Hold: original</button>
        <span id="info" class="info"></span>
      </div>
    </div>
  </section>

  <aside class="panel">
    <div class="seg" role="group" aria-label="Edit mode">
      <button id="modeSimple" class="seg-b" type="button">Simple</button>
      <button id="modeAdv" class="seg-b" type="button">Advanced</button>
    </div>

    <div id="simple">
      <div class="sec-title">Pick a look</div>
      <div id="lookGrid" class="look-grid"></div>
      <div id="simpleAdjust" class="blocks"></div>
    </div>

    <div id="advanced">
      <div class="starters"><span>Starter looks</span><div id="starters" class="chips"></div></div>
      <div class="stack-head">
        <h1>Modifiers <small>run top → bottom</small></h1>
        <button class="btn primary small" data-add>+ Add</button>
      </div>
      <div id="blocks" class="blocks"></div>
      <button class="add-big" data-add>+ Add modifier</button>
    </div>

    <section class="card out-card">
      <header><h2>Output &amp; saved looks</h2></header>
      <div class="body">
        <div id="mixHost"></div>
        <div class="row"><label for="maxDim">Max size</label>
          <select id="maxDim">
            <option value="600">600 px</option>
            <option value="900">900 px</option>
            <option value="1200">1200 px</option>
            <option value="1600">1600 px</option>
            <option value="2400">2400 px</option>
          </select></div>
        <div class="row inline">
          <button class="btn small" id="btnSaveLook" type="button">Save current look</button>
          <button class="btn small" id="btnReset" type="button">Reset stack</button>
        </div>
        <ul id="looks" class="looks"></ul>
        <p class="hint" id="storeHint">Your image, stack and settings are saved in this browser automatically.</p>
      </div>
    </section>
  </aside>
</main>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grab" aria-hidden="true"></div>
    <div class="sheet-head"><b id="sheetTitle"></b><button class="btn small" id="sheetClose">Done</button></div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
