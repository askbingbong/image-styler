<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Styler</title>
<meta name="description" content="Posterize, add noise, pixelate/compress and dither your photos. Runs entirely in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111'/%3E%3Cpath d='M4 4h8v8H4zM20 4h8v8h-8zM12 12h8v8h-8zM4 20h8v8H4zM20 20h8v8h-8z' fill='%23ff5ea8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true"></span>Image Styler</div>
  <div class="actions">
    <button id="btnOpen" class="btn">Upload</button>
    <button id="btnDownload" class="btn primary" disabled>Download PNG</button>
  </div>
  <input id="file" type="file" accept="image/*" hidden>
</header>

<main class="layout">
  <section class="stage" id="stage">
    <div id="drop" class="drop">
      <div class="drop-inner">
        <div class="drop-title">Drop an image here</div>
        <p>or click to upload, or paste from clipboard</p>
        <button class="btn" id="btnSample" type="button">Try a sample</button>
      </div>
    </div>
    <div id="canvasWrap" class="canvas-wrap" hidden>
      <canvas id="out"></canvas>
      <canvas id="orig" hidden></canvas>
      <div class="stage-bar">
        <button id="btnCompare" class="btn small" title="Hold to see the original">Hold: original</button>
        <span id="info" class="info"></span>
      </div>
    </div>
  </section>

  <aside class="panel">
    <!-- 1. POSTERIZE -->
    <section class="card">
      <header><label class="sw-toggle"><input type="checkbox" data-k="posterize.on"><span></span></label><h2>1 · Posterize</h2></header>
      <div class="body">
        <div class="row">
          <label>Colors <output id="pcountOut">6</output></label>
          <input type="range" id="pcount" min="3" max="16" step="1" value="6">
        </div>
        <div id="swatches" class="swatches"></div>
        <div class="row inline">
          <select id="presets" aria-label="Palette preset"></select>
          <button class="btn small" id="btnExtract" type="button" title="Pick colors from the image">From image</button>
          <button class="btn small" id="btnRandom" type="button">Random</button>
        </div>
      </div>
    </section>

    <!-- 2. NOISE -->
    <section class="card">
      <header><label class="sw-toggle"><input type="checkbox" data-k="noise.on"><span></span></label><h2>2 · Generate noise</h2></header>
      <div class="body">
        <div class="row"><label>Amount <output data-o="noise.amount"></output></label>
          <input type="range" data-k="noise.amount" min="0" max="100" step="1"></div>
        <div class="row"><label>Grain size <output data-o="noise.size"></output></label>
          <input type="range" data-k="noise.size" min="1" max="8" step="1"></div>
        <div class="row inline">
          <label class="check"><input type="checkbox" data-k="noise.mono"> Monochrome</label>
          <button class="btn small" id="btnReseed" type="button">Reseed</button>
        </div>
      </div>
    </section>

    <!-- 3. PIXELATE / COMPRESS -->
    <section class="card">
      <header><label class="sw-toggle"><input type="checkbox" data-k="pixel.on"><span></span></label><h2>3 · Pixelate / compress</h2></header>
      <div class="body">
        <div class="row"><label>Pixel size <output data-o="pixel.size"></output></label>
          <input type="range" data-k="pixel.size" min="1" max="32" step="1"></div>
        <div class="row inline"><label class="check"><input type="checkbox" data-k="pixel.compress"> JPEG compression</label></div>
        <div class="row"><label>Quality <output data-o="pixel.quality"></output></label>
          <input type="range" data-k="pixel.quality" min="1" max="100" step="1"></div>
        <div class="row"><label>Passes <output data-o="pixel.passes"></output></label>
          <input type="range" data-k="pixel.passes" min="1" max="8" step="1"></div>
      </div>
    </section>

    <!-- 4. DITHER -->
    <section class="card">
      <header><label class="sw-toggle"><input type="checkbox" data-k="dither.on"><span></span></label><h2>4 · Dither</h2></header>
      <div class="body">
        <div class="row"><label>Style</label>
          <select data-k="dither.method">
            <option value="cross">Cross-hatch</option>
            <option value="bayer4">Bayer 4×4</option>
            <option value="bayer8">Bayer 8×8</option>
            <option value="floyd">Floyd–Steinberg</option>
            <option value="atkinson">Atkinson</option>
          </select></div>
        <div class="row"><label>Strength <output data-o="dither.strength"></output></label>
          <input type="range" data-k="dither.strength" min="0" max="100" step="1"></div>
        <div class="row"><label>Dither scale <output data-o="dither.scale"></output></label>
          <input type="range" data-k="dither.scale" min="1" max="8" step="1"></div>
      </div>
    </section>

    <!-- OUTPUT + LOOKS -->
    <section class="card">
      <header><h2>Output &amp; saved looks</h2></header>
      <div class="body">
        <div class="row"><label>Max size</label>
          <select data-k="maxDim">
            <option value="600">600 px</option>
            <option value="900">900 px</option>
            <option value="1200">1200 px</option>
            <option value="1600">1600 px</option>
            <option value="2400">2400 px</option>
          </select></div>
        <div class="row inline">
          <button class="btn small" id="btnSaveLook" type="button">Save current look</button>
          <button class="btn small" id="btnReset" type="button">Reset settings</button>
        </div>
        <ul id="looks" class="looks"></ul>
        <p class="hint" id="storeHint">Your image and settings are saved in this browser automatically.</p>
      </div>
    </section>
  </aside>
</main>

<script src="app.js"></script>
</body>
</html>
